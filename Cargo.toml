[package]
name = "judgehook"
version = "0.2.0"
edition = "2021"
description = "AstroDX judgement hook: streams every judgement over a WebSocket"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# keep unwinding so hooks can catch_unwind instead of killing the game
panic = "unwind"
